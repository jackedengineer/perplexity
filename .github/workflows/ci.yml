name: Quality
on:
  pull_request:
  push:
    branches: [main, feat/foundation]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    # Cold Ubuntu font downloads have exceeded ten minutes before tests begin.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.34.5 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: offline-evaluation-summary
          path: .artifacts/evals/offline.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 15
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-failures
          path: test-results/
          retention-days: 7
